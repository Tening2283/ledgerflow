name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledgerflow
          POSTGRES_PASSWORD: ledgerflow
          POSTGRES_DB: ledgerflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledgerflow" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://ledgerflow:ledgerflow@localhost:5432/ledgerflow?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/1
      - run: docker build -t ledgerflow .
